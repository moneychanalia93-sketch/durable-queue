[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-queue"
version = "0.1.0"
description = "An SQS-style message queue built from first principles: at-least-once delivery, write-ahead log, consistent hashing, replication. Standard library only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Money Chanalia" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Distributed Computing",
]

[project.scripts]
dq = "dq.cli:main"

[tool.setuptools.packages.find]
include = ["dq*"]
